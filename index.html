<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar fixed-top">
    <div class="container-fluid">
      <a class="brand">Weatherify</a>
      <form class="search" role="search">
        <input class="form-control me-2" type="search" id="cityInput" placeholder="Enter city" aria-label="Search">
        <button id="searchBtn" class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-4">
        <div class="card card-1">
          <img id="weatherImg1" src="https://fthmb.tqn.com/1OqUvw1FWllH7m91p786Kevpm3k=/1500x1290/filters:fill(auto,1)/Nick-Koudis-chime-56a2e2725f9b58b7d0cf8251.jpg" class="card-img-top" alt="Weather Image">
          <div class="card-body">
            <h5 class="card-title" style="text-align: center; font-size: 40px;">Wind</h5>
            <p class="Wind">$</p>
            <p class="subtitle">Wind Direction</p>
            <p class="wind-direction">$</p>
            <p class="subtitle">Pressure</p>
            <p class="pressure">$</p>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card card-2">
          <img id="weatherImg2" src="https://c8.alamy.com/comp/2D76092/hot-and-cold-icon-thermometer-warm-with-sun-cold-and-snowflake-meteorology-thermometers-celsius-and-fahrenheit-vector-outdoor-temperature-cartoon-logo-flat-web-sign-2D76092.jpg" class="card-img-top" alt="Weather Image">
          <div class="card-body">
            <h5 class="card-title" style="text-align: center; font-size: 40px;">Temperature</h5>
            <p class="Temperature">$</p>
            <p class="subtitle">Feels Like</p>
            <p class="Temperature_feel">$</p>
            <p class="subtitle">Max Temperature</p>
            <p class="max-temp">$</p>
            <p class="subtitle">Min Temperature</p>
            <p class="min-temp">$</p>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card card-3">
          <img id="weatherImg3" src="https://tse3.mm.bing.net/th?id=OIP.WQfEoBEJStlDTNt0zFCMbgHaES&pid=Api&P=0&h=180" class="card-img-top" alt="Weather Image">
          <div class="card-body">
            <h5 class="card-title" style="text-align: center; font-size: 40px;">Humidity</h5>
            <p class="Humidity">$</p>
            <p class="subtitle">Visibility</p>
            <p class="visibility">$</p>
            <p class="subtitle">Sunrise</p>
            <p class="sunrise">$</p>
            <p class="subtitle">Sunset</p>
            <p class="sunset">$</p>
          </div>
        </div>
      </div>
    </div>

    <div class="location">Select a Location</div>
    <div id="description"  class="location">Weather</div>
  </div>

  <script src="weather.js"></script>
</body>
</html>
